<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alternar Huevo 1 / Huevo 2</title>
<script src="https://cdn.tailwindcss.com"></script>
<meta name="description" content="Página simple con Tailwind para alternar entre dos imágenes (Huevo1 y Huevo2) con un botón." />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800">
<main class="flex items-center justify-center min-h-screen p-4">
<section class="w-full max-w-md">
<div class="bg-white/90 backdrop-blur rounded-2xl shadow-xl ring-1 ring-slate-200 p-6 md:p-8">
<header class="text-center mb-6">
<h1 class="text-2xl md:text-3xl font-semibold tracking-tight">Huevo mágico 🥚</h1>
<p class="mt-1 text-sm text-slate-500">Pulsa el botón para cambiar entre las imágenes.</p>
</header>


<figure class="aspect-square w-full overflow-hidden rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-center">

<img
id="imagen-huevo"
src="Imagenes/Huevo1.jpeg"
alt="Imagen del Huevo 1"
class="max-h-full max-w-full object-contain select-none"
draggable="false"
/>
</figure>


<div class="mt-6 flex justify-center">
<button
id="boton-toggle"
type="button"
class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl shadow-sm border border-slate-200 bg-slate-900 text-white hover:opacity-90 active:scale-[0.99] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
aria-pressed="false"
>
Cambiar imagen
</button>
</div>
</div>
</section>
</main>


<script>
(function () {
const imagen = document.getElementById("imagen-huevo");
const boton = document.getElementById("boton-toggle");

const fuentes = [
{ src: "Imagenes/Huevo1.jpeg", alt: "Imagen del Huevo 1" },
{ src: "Imagenes/Huevo2.jpeg", alt: "Imagen del Huevo 2" },
];


let indice = 0;


fuentes.forEach(({ src }) => {
const i = new Image();
i.src = src;
});


boton.addEventListener("click", () => {
indice = indice === 0 ? 1 : 0;
const { src, alt } = fuentes[indice];
imagen.src = src;
imagen.alt = alt;
const pressed = boton.getAttribute("aria-pressed") === "true";
boton.setAttribute("aria-pressed", String(!pressed));
});
})();
</script>
</body>
</html>
